<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>深场 DEEP FIELD · 8s</title>
<style>
  :root{--bg:#030507;--ice:#9ff3ff;--steel:#cfd6dd}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg)}
  body{font-family:"Helvetica Neue","PingFang SC",Arial,sans-serif;color:var(--steel)}
  .stage{position:relative;width:1920px;height:1080px;overflow:hidden}
  .sky{position:absolute;inset:-10%;background:url("../assets/carina-large.jpg") center/cover;
    filter:saturate(.42) contrast(1.32) brightness(.66) hue-rotate(168deg);opacity:.85;
    transform:scale(var(--zoom,1.02)) translate3d(var(--sx,0),var(--sy,0),0)}
  .veil{position:absolute;inset:0;
    background:radial-gradient(120% 90% at 50% 42%,rgba(3,5,7,0) 0%,rgba(3,5,7,.55) 58%,rgba(3,5,7,.95) 100%),
               linear-gradient(180deg,rgba(3,5,7,.92),rgba(3,5,7,.08) 32%,rgba(3,5,7,.94))}
  .scan{position:absolute;inset:0;opacity:.24;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.45) 0 1px,rgba(0,0,0,0) 1px 3px)}
  .grain{position:absolute;inset:0;opacity:.2;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}
  .hud{position:absolute;inset:34px 44px}
  .corner{position:absolute;width:30px;height:30px;border:1px solid rgba(159,243,255,.45)}
  .tl{left:0;top:0;border-right:0;border-bottom:0}
  .tr{right:0;top:0;border-left:0;border-bottom:0}
  .bl{left:0;bottom:0;border-right:0;border-top:0}
  .br{right:0;bottom:0;border-left:0;border-top:0}
  .mono{font-family:"SF Mono",Menlo,monospace;font-size:12px;letter-spacing:.18em;color:rgba(159,243,255,.72)}
  .top{position:absolute;top:60px;left:70px;right:70px;display:flex;justify-content:space-between;
    opacity:var(--ui-o,0)}
  .ring{position:absolute;left:50%;top:50%;width:760px;height:760px;transform:translate(-50%,-50%) rotate(var(--ring,0deg));
    border-radius:50%;opacity:.75;
    background:conic-gradient(from 0deg,rgba(159,243,255,0) 0deg,rgba(159,243,255,.5) 20deg,rgba(159,243,255,0) 44deg,
      rgba(159,243,255,0) 180deg,rgba(159,243,255,.26) 203deg,rgba(159,243,255,0) 230deg);
    -webkit-mask:radial-gradient(circle,transparent 69.4%,#000 69.8%,#000 70.4%,transparent 70.8%);
    mask:radial-gradient(circle,transparent 69.4%,#000 69.8%,#000 70.4%,transparent 70.8%)}
  .core{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
  .zh{font-family:"Songti SC",serif;font-size:20px;letter-spacing:1.2em;color:rgba(207,214,221,.8);
    margin-bottom:30px;text-indent:1.2em;opacity:var(--zh-o,0);transform:translateY(var(--zh-y,12px))}
  .chrome{position:relative;font-size:172px;line-height:.9;font-weight:800;letter-spacing:var(--ls,.02em);
    background:linear-gradient(178deg,#f4f9ff 4%,#b9c6d2 22%,#5d6a76 42%,#eef6ff 53%,#8e9aa6 66%,#2c343c 84%,#dfeaf5 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    opacity:var(--h-o,0);transform:translateY(var(--h-y,26px)) scale(var(--h-s,1));
    filter:drop-shadow(0 2px 30px rgba(159,243,255,.12))}
  .chrome small{display:block;font-size:17px;letter-spacing:.5em;font-weight:500;margin-top:24px;
    color:rgba(159,243,255,.9);background:none;-webkit-text-fill-color:rgba(159,243,255,.9);
    opacity:var(--s-o,0)}
  .ghost{position:absolute;inset:0;font-size:inherit;font-weight:800;letter-spacing:inherit;line-height:inherit;
    color:transparent;-webkit-text-stroke:1px rgba(159,243,255,.3)}
  .ghost.g1{transform:translate(calc(-3px * var(--glitch,0)),calc(2px * var(--glitch,0)));-webkit-text-stroke-color:rgba(255,60,120,.32)}
  .ghost.g2{transform:translate(calc(3px * var(--glitch,0)),calc(-2px * var(--glitch,0)));-webkit-text-stroke-color:rgba(159,243,255,.32)}
  .tagline{margin-top:34px;font-size:14px;letter-spacing:.36em;color:rgba(207,214,221,.76);
    opacity:var(--t-o,0);transform:translateY(var(--t-y,14px))}
  .tagline b{color:var(--ice);font-weight:500}
  .bottom{position:absolute;left:70px;right:70px;bottom:56px;display:flex;justify-content:space-between;
    align-items:flex-end;opacity:var(--b-o,0);transform:translateY(var(--b-y,16px))}
  .stats{display:flex;gap:52px}
  .stats div{font-family:"SF Mono",monospace;font-size:11px;letter-spacing:.15em;color:#9aa8b1;line-height:1.9}
  .stats b{display:block;font-family:"Helvetica Neue",sans-serif;font-size:19px;color:#eef4f8;font-weight:500}
  .enter{border:1px solid rgba(159,243,255,.55);padding:15px 30px;color:var(--ice);font-size:13px;
    letter-spacing:.32em;background:rgba(159,243,255,.05)}
  .flash{position:absolute;inset:0;background:rgba(159,243,255,1);opacity:var(--flash,0);mix-blend-mode:screen}
</style>
</head>
<body>
<div class="stage">
  <div class="sky"></div><div class="veil"></div><div class="ring"></div><div class="scan"></div>
  <div class="top mono"><span>● LIVE FEED / DEEP FIELD</span><span>2027.03.21—06.20　31.05°N 121.92°E</span></div>
  <div class="core">
    <div class="zh">深 场</div>
    <h1 class="chrome">
      <span class="ghost g1">DEEP FIELD</span>
      <span class="ghost g2">DEEP FIELD</span>
      DEEP FIELD
      <small>134 亿年前的光</small>
    </h1>
    <p class="tagline">十二幅深空影像　·　一间暗房　·　<b>一次向外的回望</b></p>
  </div>
  <div class="bottom">
    <div class="stats"><div><b>12</b>FRAMES</div><div><b>7.7H</b>EXPOSURE</div><div><b>−58°</b>DECLINATION</div><div><b>3</b>HALL</div></div>
    <div class="enter">ENTER THE DARK →</div>
  </div>
  <div class="hud"><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i></div>
  <div class="flash"></div>
  <div class="grain"></div>
</div>
<script>
  const clamp = (v) => Math.max(0, Math.min(1, v));
  const ease = (x) => x < .5 ? 2*x*x : 1 - Math.pow(-2*x+2, 2)/2;
  const seg = (t, a, b) => ease(clamp((t - a) / (b - a)));
  window.setT = (t) => {
    const s = document.documentElement.style;
    // 8s 时间轴
    const zoom = 1.02 + seg(t, 0, 8) * 0.10;
    s.setProperty('--zoom', zoom.toFixed(4));
    s.setProperty('--sx', (-0.8 + seg(t,0,8)*2.2).toFixed(3) + '%');
    s.setProperty('--sy', (0.4 - seg(t,0,8)*1.1).toFixed(3) + '%');
    s.setProperty('--ring', (t * 14).toFixed(2) + 'deg');

    const ui = seg(t, .25, .9);
    s.setProperty('--ui-o', ui.toFixed(3));

    const zh = seg(t, .35, 1.0);
    s.setProperty('--zh-o', zh.toFixed(3));
    s.setProperty('--zh-y', (12 * (1-zh)).toFixed(2) + 'px');

    const h = seg(t, .5, 1.5);
    s.setProperty('--h-o', h.toFixed(3));
    s.setProperty('--h-y', (26 * (1-h)).toFixed(2) + 'px');
    s.setProperty('--h-s', (0.985 + 0.015*h).toFixed(4));
    s.setProperty('--ls', (0.12 - 0.10*h).toFixed(4) + 'em');

    const sub = seg(t, 1.35, 2.0);
    s.setProperty('--s-o', sub.toFixed(3));

    const tag = seg(t, 1.8, 2.6);
    s.setProperty('--t-o', tag.toFixed(3));
    s.setProperty('--t-y', (14 * (1-tag)).toFixed(2) + 'px');

    const bot = seg(t, 2.6, 3.4);
    s.setProperty('--b-o', bot.toFixed(3));
    s.setProperty('--b-y', (16 * (1-bot)).toFixed(2) + 'px');

    // 两处轻微 glitch + 一次闪
    const g = (t > 3.15 && t < 3.32) ? 1 : (t > 5.85 && t < 5.97 ? .7 : 0);
    s.setProperty('--glitch', g);
    const flash = (t > 1.45 && t < 1.62) ? 0.06 : 0;
    s.setProperty('--flash', flash);
  };
  const q = new URLSearchParams(location.search);
  window.setT(parseFloat(q.get('t') || '8'));
</script>
</body>
</html>
